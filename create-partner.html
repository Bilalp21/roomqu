<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Partner Account</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            padding: 12px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 14px;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🏨 Create Partner Account</h1>
        <p class="subtitle">Buat akun partner untuk mengelola hotel</p>

        <div class="info">
            <strong>Info:</strong> Email harus dimulai dengan "partner" (contoh: partner@example.com) untuk mendapatkan
            role partner.
        </div>

        <form id="createPartnerForm">
            <div class="form-group">
                <label for="email">Email Partner *</label>
                <input type="email" id="email" placeholder="partner@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" id="password" placeholder="Minimal 6 karakter" required minlength="6">
            </div>

            <div class="form-group">
                <label for="displayName">Nama Partner/Perusahaan *</label>
                <input type="text" id="displayName" placeholder="PT Hotel Indonesia" required>
            </div>

            <div class="form-group">
                <label for="phone">Nomor Telepon</label>
                <input type="tel" id="phone" placeholder="+62 812 3456 7890">
            </div>

            <div class="form-group">
                <label for="businessType">Tipe Bisnis</label>
                <select id="businessType">
                    <option value="individual">Individual</option>
                    <option value="partner">Partner</option>
                    <option value="official">Official Partner</option>
                </select>
            </div>

            <button type="submit" id="submitBtn">Create Partner Account</button>
        </form>

        <div id="message"></div>
    </div>

    <script type="module">
        // Firebase configuration - CONFIG YANG BENAR
        const firebaseConfig = {
            apiKey: "AIzaSyAVXjeolA7TAA9eJPFow3ZLdQj98m-MLYU",
            authDomain: "roomquindonesia.firebaseapp.com",
            projectId: "roomquindonesia",
            storageBucket: "roomquindonesia.firebasestorage.app",
            messagingSenderId: "126300204357",
            appId: "1:126300204357:web:ad1f95388fa1cf1218222c"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const form = document.getElementById('createPartnerForm');
        const messageDiv = document.getElementById('message');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const displayName = document.getElementById('displayName').value;
            const phone = document.getElementById('phone').value;
            const businessType = document.getElementById('businessType').value;

            // Validate email starts with "partner"
            if (!email.startsWith('partner')) {
                showMessage('Email harus dimulai dengan "partner" (contoh: partner@example.com)', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating account...';

            try {
                // Create user in Firebase Auth
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;

                // Update display name
                await user.updateProfile({
                    displayName: displayName
                });

                // Create user document in Firestore
                await db.collection('users').doc(user.uid).set({
                    email: email,
                    displayName: displayName,
                    role: 'partner',
                    phone: phone || '',
                    businessType: businessType,
                    verificationStatus: 'pending',
                    totalHotels: 0,
                    totalRevenue: 0,
                    commission: businessType === 'official' ? 15 : businessType === 'partner' ? 12 : 10,
                    rating: 0,
                    createdAt: new Date().toISOString()
                });

                showMessage(`✅ Partner account berhasil dibuat!<br>Email: ${email}<br>Password: ${password}<br><br>Silakan login di /partner/login`, 'success');

                // Sign out after creating
                await auth.signOut();

                // Reset form
                form.reset();

            } catch (error) {
                console.error('Error:', error);
                let errorMessage = 'Gagal membuat akun: ' + error.message;

                if (error.code === 'auth/email-already-in-use') {
                    errorMessage = 'Email sudah terdaftar. Gunakan email lain.';
                } else if (error.code === 'auth/weak-password') {
                    errorMessage = 'Password terlalu lemah. Minimal 6 karakter.';
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = 'Format email tidak valid.';
                }

                showMessage(errorMessage, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Partner Account';
            }
        });

        function showMessage(text, type) {
            messageDiv.innerHTML = text;
            messageDiv.className = 'message ' + type;
        }
    </script>
</body>

</html>
